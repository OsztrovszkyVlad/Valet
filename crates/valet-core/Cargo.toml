[package]
name = "valet-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread","macros"] }
sqlx = { version = "0.7", features = ["sqlite","runtime-tokio-rustls","migrate","chrono"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
uuid = { version = "1", features = ["v4","v5","serde"] }
walkdir = "2"
blake3 = "1"
regex = "1"

[features]
# Exposes platform::testing::FakePlatform to integration tests and other crates' tests.
test-support = []

[dev-dependencies]
tempfile = "3"
proptest = "1"
# Benches in benches/: `cargo bench -p valet-core --features test-support --bench '*' -- --quick`
# (`--bench '*'` keeps the lib's libtest harness from receiving `--quick`).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Self dev-dependency so integration tests get FakePlatform.
valet-core = { path = ".", features = ["test-support"] }

# Fault-injection driver for tests/fault_injection.rs. Not shipped.
[[bin]]
name = "valet-fault"
path = "src/bin/valet-fault.rs"
required-features = ["test-support"]

[[test]]
name = "prop_planner"
required-features = ["test-support"]

[[test]]
name = "fault_injection"
required-features = ["test-support"]

[[test]]
name = "integration_10k"
required-features = ["test-support"]

[[bench]]
name = "plan_10k"
harness = false
required-features = ["test-support"]

[[bench]]
name = "collision_next_free_name"
harness = false
