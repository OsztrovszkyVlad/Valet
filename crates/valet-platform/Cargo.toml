[package]
name = "valet-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

# Match the version family that `notify-debouncer-mini` expects to avoid type mismatches
notify = { version = "6.1", default-features = false, features = ["macos_fsevent", "serde"] }
notify-debouncer-mini = "0.4.1"
trash = "=5.2.9"
# Optional (implicit feature `valet-core`): enables `SystemPlatform`, the
# valet_core::platform::Platform impl. The app turns it on. Off by default so
# `cargo clippy -p valet-platform --target x86_64-pc-windows-msvc` works from
# Linux: valet-core pulls sqlx, whose C dependencies need the MSVC toolchain.
valet-core = { path = "../valet-core", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
