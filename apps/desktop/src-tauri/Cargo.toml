[package]
name = "app"
version = "0.1.0"
description = "Rules-based file organizer for Windows"
authors = ["Osztrovszky Vlad"]
license = "MIT"
repository = "https://github.com/OsztrovszkyVlad/Valet"
edition = "2021"
# tauri 2.12 and its plugins need 1.90.
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
regex = "1.0"
tauri = { version = "2.8.5", features = ["tray-icon"] }
# Pinned: logging.rs relies on its RotationStrategy::KeepSome semantics
# (N rotated files plus the active one).
tauri-plugin-log = { version = "=2.10.1", features = ["colored"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
# Initialized only when the build config has `plugins.updater` (release
# builds, see docs/RELEASE.md). No `zip` feature: the NSIS updater artifact
# is the signed setup.exe itself.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
valet-core = { path = "../../../crates/valet-core" }
valet-platform = { path = "../../../crates/valet-platform", features = ["valet-core"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
