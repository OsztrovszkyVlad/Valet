name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (core, platform)
        run: cargo clippy -p valet-core -p valet-platform --all-targets -- -D warnings
      - name: Test (core, platform)
        shell: bash
        run: bash scripts/ci-test.sh -p valet-core -p valet-platform
      - name: Clippy (core with test-support)
        run: cargo clippy -p valet-core --all-targets --features test-support -- -D warnings
      - name: Test (core with test-support; fault injection x100)
        shell: bash
        run: bash scripts/ci-test.sh -p valet-core --features test-support
        env:
          VALET_FAULT_ITERS: "100"
      - name: Perf plan 10k, index 100k and integration 10k (release)
        shell: bash
        run: bash scripts/ci-test.sh -p valet-core --release --features test-support --test perf_plan_10k --test integration_10k --test perf_index_100k -- --include-ignored --nocapture
      # Report only (timings on shared runners are noisy): never fails the job.
      # One notice annotation per bench so the numbers are readable through
      # the checks API.
      - name: Benches (criterion --quick, report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p valet-core --features test-support --bench '*' -- --quick 2>&1 | tee bench.log
          code=${PIPESTATUS[0]}
          awk '
            /time:[[:space:]]+\[/ {
              name = $0; sub(/time:.*/, "", name); gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name == "") name = prev
              t = $0; sub(/.*time:[[:space:]]+/, "", t)
              print "::notice title=bench::" name " " t
            }
            NF { prev = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", prev) }
          ' bench.log
          exit "$code"

  frontend:
    name: frontend (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test (vitest)
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: i18n keys (ro.json and en.json)
        if: ${{ !cancelled() }}
        run: pnpm check:i18n
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  # UI smoke test (PLAN 2 exit criterion, PLAN 4.6): onboarding -> preview ->
  # organize -> undo -> history through tauri-driver + WebKitWebDriver under
  # Xvfb. The app runs with a temp HOME (tests/e2e/smoke.mjs). Blocking.
  e2e-linux:
    name: e2e smoke (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_DRIVER_VERSION: "2.0.6"
    steps:
      - uses: actions/checkout@v4
      - name: System packages (webkit2gtk, WebKitWebDriver, Xvfb)
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb dbus locales
          # Romanian dates in the UI (toLocaleString uses the system locale).
          sudo locale-gen ro_RO.UTF-8
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-linux
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend
        id: frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build app (embedded dist/)
        id: build
        run: cargo build -p app --features tauri/custom-protocol
      - name: Cache tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}
      - name: Install tauri-driver
        id: driver
        run: |
          if ! tauri-driver --help >/dev/null 2>&1; then
            cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
          fi
      - name: Smoke test (onboarding, preview, organize, undo, history)
        id: smoke
        run: bash scripts/e2e-linux.sh target/debug/app e2e-screenshots
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: Report the failing step
        if: ${{ failure() }}
        run: |
          for s in "apt=${{ steps.apt.outcome }}" "frontend=${{ steps.frontend.outcome }}" \
                   "build=${{ steps.build.outcome }}" "driver=${{ steps.driver.outcome }}" \
                   "smoke=${{ steps.smoke.outcome }}"; do
            [ "${s#*=}" = failure ] && echo "::error title=e2e-linux::step '${s%%=*}' failed (the smoke step prints its own annotation with the UI text)"
          done
          true

  # Same smoke test on Windows (WebView2 + msedgedriver). Report only. The
  # job downloads the msedgedriver matching the WebView2 runtime version (the
  # preinstalled one follows the Edge browser). The app uses the runner's
  # real Downloads and %APPDATA% (ephemeral VM).
  e2e-windows:
    name: e2e smoke (Windows, report only)
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_DRIVER_VERSION: "2.0.6"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-windows
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile; if ($?) { pnpm build }
      - name: Build app (embedded dist/)
        run: cargo build -p app --features tauri/custom-protocol
      - name: Install tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      # msedgedriver must match the WebView2 runtime the app runs on, not the
      # Edge browser ($env:EDGEWEBDRIVER). A mismatched driver fails at
      # POST /session with "DevToolsActivePort file doesn't exist".
      - name: msedgedriver matching the WebView2 runtime
        id: edgedriver
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $wv = $null
          foreach ($k in $keys) {
            $pv = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv
            if ($pv -and $pv -ne '0.0.0.0') {
              $wv = $pv
              Write-Output "::notice title=e2e-windows::WebView2 runtime $pv (registry $k)"
              break
            }
          }
          if (-not $wv) { Write-Output "::warning title=e2e-windows::WebView2 runtime version not found in the registry" }

          $edgeExe = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (Test-Path $edgeExe) {
            Write-Output "::notice title=e2e-windows::Edge browser $((Get-Item $edgeExe).VersionInfo.ProductVersion)"
          }
          $preinstalled = if ($env:EDGEWEBDRIVER) { Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' } else { '' }
          if ($preinstalled -and (Test-Path $preinstalled)) {
            Write-Output "::notice title=e2e-windows::preinstalled msedgedriver $((& $preinstalled --version | Out-String).Trim())"
          }

          $driver = ''
          if ($wv) {
            $dir = Join-Path $env:RUNNER_TEMP "msedgedriver-$wv"
            $zip = "$dir.zip"
            foreach ($hostUrl in @('https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net')) {
              $url = "$hostUrl/$wv/edgedriver_win64.zip"
              try {
                Invoke-WebRequest -Uri $url -OutFile $zip
                Expand-Archive -Path $zip -DestinationPath $dir -Force
                $candidate = Join-Path $dir 'msedgedriver.exe'
                if (Test-Path $candidate) { $driver = $candidate; break }
                Write-Output "::warning title=e2e-windows::$url has no msedgedriver.exe"
              } catch {
                $msg = $_.Exception.Message -replace '\s+', ' '
                Write-Output "::warning title=e2e-windows::download $url failed: $msg"
              }
            }
          }
          if (-not $driver) {
            if (-not ($preinstalled -and (Test-Path $preinstalled))) {
              Write-Output "::error title=e2e-windows::no msedgedriver: download failed and none preinstalled"
              exit 1
            }
            Write-Output "::warning title=e2e-windows::using the preinstalled msedgedriver (matches the Edge browser, may not match WebView2)"
            $driver = $preinstalled
          }
          Write-Output "::notice title=e2e-windows::msedgedriver used: $((& $driver --version | Out-String).Trim()) ($driver)"
          "path=$driver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      # msedgedriver passes --remote-debugging-port=0 to WebView2 through
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, and WebView2 ignores that
      # variable when the app sets AdditionalBrowserArguments (wry always
      # does). CI run of commit 9968bac, "diag" annotations: the browser process starts
      # without the flag, so DevToolsActivePort never appears.
      # Annotation "diag E": does the WebView2 policy key reach the browser.
      - name: Diagnostics (WebView2 policy)
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/e2e-windows-diag.ps1 -AppPath target/debug/app.exe -EdgeDriver "${{ steps.edgedriver.outputs.path }}" -Cases E
      # Option 1: the same binary, the port flag through the WebView2 policy.
      - name: Smoke test (tauri-driver, WebView2 policy)
        id: smoke_policy
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          EDGE_DRIVER: ${{ steps.edgedriver.outputs.path }}
        run: |
          $key = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'app.exe' -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null
          try {
            node tests/e2e/smoke.mjs --app target/debug/app.exe --native-driver $env:EDGE_DRIVER --screenshots e2e-screenshots-policy
            $code = $LASTEXITCODE
          } finally {
            Remove-ItemProperty -Path $key -Name 'app.exe' -ErrorAction SilentlyContinue
          }
          if ($code -eq 0) { Write-Output "::notice title=e2e-windows::smoke passed with the WebView2 policy" }
          exit $code
      # Option 2: a test build whose window config adds the port flag to the
      # WebView2 arguments (TAURI_CONFIG is merged into tauri.conf.json at
      # build time; product code and tauri.conf.json stay unchanged).
      - name: Build app for e2e (additionalBrowserArgs with --remote-debugging-port=0)
        if: ${{ steps.smoke_policy.outcome == 'failure' }}
        shell: pwsh
        run: |
          ./scripts/e2e-windows-reset.ps1 -Tag policy
          $env:TAURI_CONFIG = node scripts/e2e-tauri-config.mjs 0
          Write-Output "::notice title=e2e-windows::TAURI_CONFIG $env:TAURI_CONFIG"
          cargo build -p app --features tauri/custom-protocol
      - name: Smoke test (tauri-driver, additionalBrowserArgs build)
        if: ${{ steps.smoke_policy.outcome == 'failure' }}
        timeout-minutes: 8
        shell: pwsh
        env:
          EDGE_DRIVER: ${{ steps.edgedriver.outputs.path }}
        run: |
          node tests/e2e/smoke.mjs --app target/debug/app.exe --native-driver $env:EDGE_DRIVER --screenshots e2e-screenshots
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Output "::notice title=e2e-windows::smoke passed with the additionalBrowserArgs build" }
          exit $code
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-screenshots
          path: |
            e2e-screenshots
            e2e-screenshots-policy
          if-no-files-found: ignore

  windows:
    name: workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build frontend (creates dist for generate_context!)
        working-directory: apps/desktop
        run: pnpm build
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (workspace)
        shell: bash
        run: bash scripts/ci-test.sh --workspace
      - name: Test (core with test-support; fault injection x100)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/ci-test.sh -p valet-core --features test-support
        env:
          VALET_FAULT_ITERS: "100"
      - name: Clippy (platform with valet-core)
        if: ${{ !cancelled() }}
        run: cargo clippy -p valet-platform --all-targets --features valet-core -- -D warnings
      - name: Test (platform with valet-core; Windows end-to-end)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/ci-test.sh -p valet-platform --features valet-core -- --nocapture
      # Report only: startup and idle numbers (PLAN.md 2.6) as notice
      # annotations. `tauri/custom-protocol` makes the binary serve the
      # embedded dist/ (as `tauri build` does) instead of the dev server URL.
      - name: Build app (release) for idle measurement
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo build --release -p app --features tauri/custom-protocol
      - name: Measure startup and idle (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/measure-idle.ps1 -AppPath target/release/app.exe
