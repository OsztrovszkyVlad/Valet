name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (core, platform)
        run: cargo clippy -p valet-core -p valet-platform --all-targets -- -D warnings
      - name: Test (core, platform)
        run: cargo test -p valet-core -p valet-platform
      - name: Clippy (core with test-support)
        run: cargo clippy -p valet-core --all-targets --features test-support -- -D warnings
      - name: Test (core with test-support; fault injection x100)
        run: cargo test -p valet-core --features test-support
        env:
          VALET_FAULT_ITERS: "100"
      - name: Perf plan 10k, index 100k and integration 10k (release)
        run: cargo test -p valet-core --release --features test-support --test perf_plan_10k --test integration_10k --test perf_index_100k -- --include-ignored --nocapture

  windows:
    name: workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build frontend (creates dist for generate_context!)
        working-directory: apps/desktop
        run: pnpm build
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Test (core with test-support; fault injection x100)
        run: cargo test -p valet-core --features test-support
        env:
          VALET_FAULT_ITERS: "100"
      - name: Clippy (platform with valet-core)
        run: cargo clippy -p valet-platform --all-targets --features valet-core -- -D warnings
      - name: Test (platform with valet-core; Windows end-to-end)
        run: cargo test -p valet-platform --features valet-core -- --nocapture
